[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lilith-replay-core"
version = "0.1.0"
description = "Public-safe deterministic replay/audit core scaffolding for validation engineering and governance."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0,<3.0"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "mypy>=1.8", "pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]
db = ["alembic>=1.13,<2.0", "psycopg[binary]>=3.1,<4.0", "sqlalchemy>=2.0,<3.0"]
api = ["fastapi>=0.110,<1.0", "prometheus-client>=0.20,<1.0", "uvicorn[standard]>=0.27,<1.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=lilith_replay_core",
  "--cov-report=term-missing",
  "--cov-report=xml",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  ".venv",
  ".venv_deprecated",
  "data",
  "models",
  "reports",
  "scripts",
  "workspace_code",
  "tmp_*.py",
  "temp_*.py",
  "test_*.py",
  "debug_*.py",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "B",
  "UP",
  "SIM",
  "PTH",
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
files = ["src"]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["lilith_replay_core"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0

[tool.coverage.xml]
output = "coverage.xml"
